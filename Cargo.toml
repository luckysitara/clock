[package]
name = "clockit"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
bs58 = "0.5"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenv = "0.15"
base64 = "0.22"

solana-sdk = "2.2"
solana-client = "2.2"
yellowstone-grpc-client = "10.0.0"
yellowstone-grpc-proto = { version = "10.0.0", features = ["convert"] }

[[bin]]
name = "clockit"
path = "src/main.rs"

[[bin]]
name = "verify_triton"
path = "src/bin/verify_triton.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "backtest_top_tokens"
path = "src/bin/backtest_top_tokens.rs"

[[bin]]
name = "test_live_100"
path = "src/bin/test_live_100.rs"

[[bin]]
name = "sell_all"
path = "src/bin/sell_all.rs"

[[bin]]
name = "check_position"
path = "src/bin/check_position.rs"

[lib]
name = "clockit"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
